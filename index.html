<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f1a" />
<meta name="description" content="شاشة استقبال الأخبار العاجلة" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="اليمن اليوم" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<title>اليمن اليوم — شاشة الأخبار العاجلة</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="ui.css?v=3.4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#e02424" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root{
    --red-1:#e02424; --red-2:#a51d1d; --red-3:#7f1414;
    --gr-1:#4b5563; --gr-2:#374151; --gr-3:#252c39;
    --ink:#eef2f8; --dim:#94a3b8;
    --ok:#34d399; --info:#38bdf8; --warn:#fbbf24;
    --font:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    display:flex;flex-direction:column;min-height:100vh;
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(224,36,36,.22), transparent 62%),
      radial-gradient(900px 480px at 6% 4%, rgba(56,189,248,.10), transparent 60%),
      linear-gradient(180deg,#070b13,#0a1018 55%,#070b13);
    background-attachment:fixed;
  }
  button{font-family:inherit}
  .hidden{display:none !important}

  /* ===== إطار التنبيه المضيء (إضاءة أطراف الشاشة) ===== */
  .edge-glow{position:fixed;inset:0;z-index:9990;pointer-events:none;opacity:0;
    transition:opacity .3s ease;display:none}
  .edge-glow.on{display:block;opacity:1}
  .edge-glow svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .edge-glow .ebase{fill:none;stroke:rgba(255,60,60,.34);stroke-width:2}
  .edge-glow .erun{fill:none;stroke:#ff2d2d;stroke-width:3.4;stroke-linecap:round;filter:url(#edgeBlur)}
  .edge-glow .ecore{fill:none;stroke:#fff2f2;stroke-width:1.5;stroke-linecap:round}
  .edge-glow .ehalo{position:absolute;inset:0;box-shadow:inset 0 0 46px rgba(255,40,40,.34), inset 0 0 8px rgba(255,90,90,.55);
    animation:edgePulse 1.35s ease-in-out infinite}
  @keyframes edgePulse{0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ .edge-glow .ehalo{animation:none} }

  .ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;margin-inline-end:6px}
  .ico svg{display:block}
  .chip .ico{margin-inline-end:5px}
  .livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;
    margin-inline-end:7px;vertical-align:1px;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:live 1.6s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .tag .livedot{background:#fff}
  .empty .ico svg{width:46px;height:46px;opacity:.7}

  /* ============ الشريط العلوي ============ */
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;
    background:linear-gradient(180deg,rgba(7,11,19,.97),rgba(7,11,19,.86));
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.09);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:56px;height:56px;border-radius:16px;flex:0 0 auto;display:block;
    background:#fff;object-fit:contain;padding:3px;
    box-shadow:0 10px 26px -12px rgba(224,36,36,.85);border:1px solid rgba(255,255,255,.22);
  }
  .logo-emoji{
    width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;
    background:linear-gradient(140deg,#ef4444,#7f1d1d);flex:0 0 auto;
  }
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
  .brand p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
  .grow{flex:1 1 auto}

  .conn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    padding:8px 13px;border-radius:999px}
  .conn .dot{width:9px;height:9px;border-radius:50%;background:#64748b}
  .conn .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.16)}
  .conn .dot.wait{background:var(--warn);animation:blink 1.3s infinite}
  .conn .dot.off{background:#ef4444}
  @keyframes blink{50%{opacity:.3}}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:#cbd5e1;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);padding:9px 13px;border-radius:12px;direction:ltr}
  .chip{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:#dbe3ee;
    padding:9px 13px;border-radius:12px;font-size:13.5px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  }
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip.on{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.45);color:#e0f2fe}
  .chip.off{opacity:.55}
  .chip.link{color:#bae6fd;border-color:rgba(56,189,248,.35)}
  /* زر العودة للتحرير: يظهر للمحررين فقط، بلون مميّز */
  .chip.editor-only{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.45);color:#e0f2fe}
  .chip.editor-only:hover{background:rgba(56,189,248,.28)}

  /* ============ شرائط الحالة ============ */
  .alarmbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    padding:10px 16px;font-size:13.5px;font-weight:700;
    background:rgba(239,68,68,.16);color:#fecaca;border-bottom:1px solid rgba(239,68,68,.32);
    animation:alarmPulse 2s infinite}
  @keyframes alarmPulse{50%{background:rgba(239,68,68,.3)}}
  .alarmbar .abtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    color:#fff;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .alarmbar .abtn:hover{background:rgba(255,255,255,.24)}

  .editors{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 0;max-width:1240px;margin:0 auto}
  .editors .lbl{font-size:12.5px;color:var(--dim)}
  .edchip{font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(52,211,153,.12);
    border:1px solid rgba(52,211,153,.32);color:#bbf7d0;display:inline-flex;align-items:center;gap:6px}
  .edchip i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

  /* ============ قائمة الأخبار ============ */
  .feed{max-width:1240px;margin:0 auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:15px;--fs:.9;flex:1 1 auto;width:100%}

  .card{
    position:relative;
    background:linear-gradient(135deg,var(--red-1),var(--red-2) 62%,var(--red-3));
    border:1px solid rgba(255,255,255,.20);
    border-radius:22px;
    padding:20px 24px 16px;
    color:#fff;
    box-shadow:0 22px 44px -20px rgba(224,36,36,.62), inset 0 1px 0 rgba(255,255,255,.14);
    transition:background .5s ease, box-shadow .5s ease, border-color .5s ease;
  }
  .card.copied{
    background:linear-gradient(135deg,var(--gr-1),var(--gr-2) 62%,var(--gr-3));
    border-color:rgba(255,255,255,.14);
    box-shadow:0 16px 30px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .card.copied .text{color:#f1f5f9}
  .card.pinned{outline:2px solid rgba(251,191,36,.75);outline-offset:3px}
  .card.fresh{animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes cardIn{from{opacity:0;transform:translateY(-16px) scale(.985)}}
  .card.fresh::after{
    content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(255,255,255,.34);animation:ring 1.5s ease-out 3;
  }
  @keyframes ring{to{box-shadow:0 0 0 30px rgba(255,255,255,0)}}

  .card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tag{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.28);color:#fff;
    font-size:13.5px;font-weight:800;padding:5px 13px;border-radius:999px;letter-spacing:.3px}
  .card.copied .tag{background:rgba(0,0,0,.22)}
  .who{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.95)}
  .sep{opacity:.5}
  .ts{font-size:13px;color:rgba(255,255,255,.85);font-family:ui-monospace,Menlo,Consolas,monospace}
  .mini{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.25);color:rgba(255,255,255,.9)}
  .mini.gold{background:rgba(251,191,36,.28);color:#fef3c7}
  .mini.new{background:rgba(0,0,0,.3);color:#fff;animation:blink 1.2s infinite}
  .grow2{flex:1 1 auto}

  .text{
    margin:0;
    font-size:calc(clamp(16.5px, 0.95vw + 11.5px, 26px) * var(--fs));
    line-height:1.9;
    font-weight:700;
    letter-spacing:.1px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
    -webkit-touch-callout:none;
  }
  /* النسخ متاح فقط عبر زر «نسخ الخبر» */
  .feed,.card{user-select:none;-webkit-user-select:none;-moz-user-select:none;-webkit-touch-callout:none}

  .card-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
  .stat{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
    padding:8px 15px;border-radius:999px}
  .stat.pending{background:rgba(0,0,0,.26);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.18)}
  .stat.received{background:rgba(56,189,248,.24);color:#eaf7ff;border:1px solid rgba(56,189,248,.5)}
  .stat.copied{background:rgba(52,211,153,.2);color:#e8fff6;border:1px solid rgba(52,211,153,.5)}
  .actions{display:flex;align-items:center;gap:9px;margin-inline-start:auto}
  .copy-btn{
    background:#fff;color:#b91c1c;border:none;border-radius:14px;font-weight:800;font-size:17px;
    padding:13px 28px;min-height:50px;cursor:pointer;
    box-shadow:0 12px 24px -12px rgba(0,0,0,.7);transition:.15s;
  }
  .copy-btn:hover{transform:translateY(-1px);box-shadow:0 16px 28px -12px rgba(0,0,0,.75)}
  .copy-btn:active{transform:translateY(0) scale(.99)}
  .recopy-btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.34);
    border-radius:14px;font-weight:700;font-size:13.5px;padding:11px 18px;min-height:44px;cursor:pointer}
  .recopy-btn:hover{background:rgba(255,255,255,.22)}

  .empty{text-align:center;padding:70px 20px 40px;color:var(--dim)}
  .empty .big{font-size:64px;display:block;margin-bottom:14px;opacity:.85;filter:drop-shadow(0 10px 24px rgba(224,36,36,.4))}
  .empty-logo{width:190px;max-width:58%;height:auto;border-radius:22px;margin:0 auto 18px;display:block;
    background:#fff;padding:8px;box-shadow:0 18px 40px -18px rgba(224,36,36,.6)}
  .empty h2{margin:0 0 8px;font-size:22px;color:#e2e8f0;font-weight:800}
  .empty p{margin:0;font-size:14px;line-height:2}

  .chip.ico-only{padding-inline:9px}
  .chip.ico-only .ico{margin-inline-end:0}
  .verfoot{
    max-width:1240px;margin:0 auto 30px;padding:14px 20px 0;display:flex;align-items:center;gap:10px;
    color:#64748b;font-size:12.5px;letter-spacing:.4px;
  }
  .verfoot::before,.verfoot::after{content:"";height:1px;flex:1;
    background:linear-gradient(90deg,transparent,rgba(148,163,184,.28),transparent)}
  .verfoot .vlbl{opacity:.9}
  .verfoot .vnum{font-family:ui-monospace,Menlo,Consolas,monospace;color:#94a3b8;font-weight:700}
  .hint{max-width:1240px;margin:8px auto 34px;padding:14px 20px;color:var(--dim);font-size:13px;
    text-align:center;line-height:2;border-top:1px solid rgba(255,255,255,.07)}
  .hint b{color:#cbd5e1}

  @media (max-width:720px){
    .brand h1{font-size:17px}
    .brand p{display:none}
    .clock{display:none}
    .feed{padding:12px 12px 4px}
    .card{padding:16px 16px 12px;border-radius:18px}
    .actions{margin-inline-start:0;width:100%}
    .copy-btn{flex:1}
    .copy-btn{padding:14px 18px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="logo" id="chLogo" src="assets/logo-320.png" alt="اليمن اليوم"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-emoji',textContent:'YT'}))" />
    <div>
      <h1 id="chTitle">غرفة الأخبار</h1>
      <p id="chSub">بث الأخبار العاجلة إلى غرفة التنفيذ</p>
    </div>
  </div>

  <div class="grow"></div>

  <div class="conn" title="حالة الاتصال بخادم البث">
    <span class="dot wait" id="connDot"></span><span id="connText">جارٍ الاتصال…</span>
  </div>

  <div class="controls">
    <span class="clock" id="clock">--:--:--</span>
    <a class="chip ico-only editor-only hidden" id="btnToEditor" href="send.html" aria-label="العودة إلى لوحة التحرير" title="العودة إلى لوحة التحرير"><i class="ico" data-ic="back"></i></a>
    <button class="chip sep-btn ico-only" id="btnSound" aria-label="تنبيه صوتي" title="تنبيه صوتي عند وصول خبر عاجل"><i class="ico" data-ic="sound"></i></button>
    <button class="chip" id="btnFontMinus" title="تصغير الخط">A−</button>
    <button class="chip" id="btnFontPlus" title="تكبير الخط">A+</button>
    <button class="chip ico-only" id="btnFull" aria-label="ملء الشاشة" title="ملء الشاشة — عرض الشاشة كاملة"><i class="ico" data-ic="expand"></i></button>
    <button class="chip ico-only" id="btnSettings" aria-label="الإعدادات" title="الإعدادات"><i class="ico" data-ic="gear"></i></button>
  </div>
</header>

<div class="edge-glow" id="edgeGlow" aria-hidden="true">
  <svg id="edgeSvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="edgeBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
    </defs>
    <rect class="ebase" id="edgeBase" x="2" y="2" rx="15"/>
    <rect class="erun"  id="edgeRun"  x="2" y="2" rx="15"/>
    <rect class="ecore" id="edgeCore" x="2" y="2" rx="15"/>
  </svg>
  <div class="ehalo"></div>
</div>

<div class="alarmbar hidden" id="alarmbar">
  <span class="ico" data-ic="bell"></span>
  <span id="alarmText">تنبيه متكرر كل 30 ثانية حتى يتم نسخ الخبر</span>
  <button class="abtn" id="btnAlarmMute">إسكات مؤقت</button>
  <button class="abtn" id="btnAlarmOff">إيقاف التكرار</button>
</div>

<div class="editors hidden" id="editors"><span class="lbl">المحررون المتصلون:</span></div>

<main class="feed" id="feed">
  <div class="empty" id="empty">
    <img src="assets/logo-320.png" alt="اليمن اليوم" class="empty-logo" />
    <h2>بانتظار الأخبار…</h2>
    <p>هذه شاشة الاستقبال الخاصة بغرفة التنفيذ.<br />عند إرسال أي خبر عاجل من غرفة الأخبار سيظهر هنا فوراً مع تنبيه صوتي.</p>
  </div>
</main>

<footer class="verfoot" id="verFoot" title="إصدار الصفحة — تأكّد أن النسخة الظاهرة هي الأحدث">
  <span class="vlbl">الإصدار</span>
  <span class="vnum" id="verChip">v2.4</span>
</footer>

<script src="config.js?v=3.4"></script>
<script src="core.js?v=3.4"></script>
<script>
(function () {
  'use strict';
  var U = window.URGENT;
  var cfg = U.config();
  var D = cfg.display || {};
  var room = U.room();
  var BASE = 'urgent/' + room + '/';
  var LSP = U.LS_PREFIX + room + ':';

  /* ---------- الحالة ---------- */
  var S = {
    opName: U.lsGet(LSP + 'opName', D.operatorName || 'المنفذ') || 'المنفذ',
    sound: U.lsGet(LSP + 'sound', D.sound !== false) !== false,
    edgeGlow: U.lsGet(LSP + 'edgeGlow', D.edgeGlow !== false) !== false,
    edgeColor: U.lsGet(LSP + 'edgeColor', D.edgeColor || '#ff2d2d') || '#ff2d2d',
    edgeWidth: clampNum(U.lsGet(LSP + 'edgeWidth', D.edgeWidth || 3.4), 1, 8),
    edgeGlowSize: clampNum(U.lsGet(LSP + 'edgeGlowSize', D.edgeGlowSize == null ? 3.2 : D.edgeGlowSize), 0, 12),
    edgeSpeed: clampNum(U.lsGet(LSP + 'edgeSpeed', D.edgeSpeed || 980), 200, 2600),
    edgeBaseOpacity: clampNum(U.lsGet(LSP + 'edgeBaseOpacity', D.edgeBaseOpacity == null ? 0.34 : D.edgeBaseOpacity), 0, 1),
    alarmRepeat: U.lsGet(LSP + 'alarmRepeat', D.alarmRepeat !== false) !== false,
    alarmEvery: Number(U.lsGet(LSP + 'alarmEvery', D.alarmEvery || 30)) || 30,
    alarmMutedUntil: 0,
    notifyRepeat: U.lsGet(LSP + 'notifyRepeat', D.notifyRepeat !== false) !== false,
    pushOn: false,
    pushEndpoint: '',
    fs: clampFs(Number(U.lsGet(LSP + 'fs', D.fontScale || 1)) || 1),
    editors: {},
    fresh: {},
    acksSeen: {},   // إشارات استلام/نسخ معروفة (لمنع الكتابة فوقها)
    pruned: false
  };
  function clampFs(v) { return Math.min(1.8, Math.max(0.75, v)); }
  function clampNum(v, lo, hi) { v = Number(v); if (!isFinite(v)) v = lo; return Math.min(hi, Math.max(lo, v)); }

  /* ---------- عناصر ---------- */
  var feed = U.$('#feed'), emptyBox = U.$('#empty');
  var connDot = U.$('#connDot'), connText = U.$('#connText');

  var alarmbar = U.$('#alarmbar'), alarmText = U.$('#alarmText');
  var clockEl = U.$('#clock');
  var btnSound = U.$('#btnSound');
  var editorsBox = U.$('#editors'), hintBox = U.$('#hint');

  /* ---------- المخزن والناقل ---------- */
  var store = U.createStore({ room: room, limit: 400 });
  var alerter = U.createAlerter();
  var bus = U.createBus({
    base: BASE,
    role: 'display',
    who: 'display',
    name: function () { return S.opName; },
    onMessage: onMessage,
    onState: onState,
    onReady: onReady
  });

  /* ---------- قسم الإطار المطوي (لون/سرعة/سماكة/توهج) ---------- */
  function edgeSection() {
    var c = U.collapsible('إطار التنبيه المضيء', 'frame',
      'اللون، السرعة، السماكة والتوهج — اضغط للتعديل', { open: false });
    var body = c.body;

    // تشغيل / إيقاف
    var onRow = U.rowEl('تشغيل الإطار', 'يظهر ما دام هناك خبر لم يُنسخ');
    var sw = U.switchEl(S.edgeGlow !== false, function (v) {
      S.edgeGlow = v; U.lsSet(LSP + 'edgeGlow', v); updateAlarmBar();
      body.classList.toggle('off', !v);
    });
    onRow.appendChild(sw);
    body.appendChild(onRow);
    if (!S.edgeGlow) body.classList.add('off');

    // اللون
    var colRow = U.rowEl('اللون', 'اختر لوناً جاهزاً أو لوناً مخصصاً');
    var picker = U.colorPicker(U.EDGE_COLORS, S.edgeColor, function (v) {
      S.edgeColor = v; U.lsSet(LSP + 'edgeColor', v); edgeApplyStyle(); sw.on && 0;
      if (!S.edgeGlow) { S.edgeGlow = true; U.lsSet(LSP + 'edgeGlow', true); updateAlarmBar(); }
      preview();
    });
    colRow.appendChild(picker.wrap);
    body.appendChild(colRow);

    // السرعة
    var spdRow = U.rowEl('السرعة', 'سرعة دوران الضوء على الأطراف');
    var spd = U.slider({ min: 200, max: 2600, step: 20, value: S.edgeSpeed, unit: ' بكسل/ث', onInput: function (v) {
      S.edgeSpeed = v; U.lsSet(LSP + 'edgeSpeed', v); edgeResize();
    }});
    spd.input.setAttribute('data-role', 'edge-speed');
    spdRow.appendChild(spd.wrap);
    body.appendChild(spdRow);

    // السماكة
    var widRow = U.rowEl('السماكة', 'سماكة الخط المضيء');
    var wid = U.slider({ min: 1, max: 8, step: 0.2, value: S.edgeWidth, unit: 'px', onInput: function (v) {
      S.edgeWidth = v; U.lsSet(LSP + 'edgeWidth', v); edgeApplyStyle(); edgeResize();
    }});
    wid.input.setAttribute('data-role', 'edge-width');
    widRow.appendChild(wid.wrap);
    body.appendChild(widRow);

    // التوهج
    var glRow = U.rowEl('التوهج', 'شدة انتشار الضوء حول الإطار (0 = بلا توهج)');
    var gl = U.slider({ min: 0, max: 12, step: 0.2, value: S.edgeGlowSize, unit: '', onInput: function (v) {
      S.edgeGlowSize = v; U.lsSet(LSP + 'edgeGlowSize', v); edgeApplyStyle();
    }});
    gl.input.setAttribute('data-role', 'edge-glow');
    glRow.appendChild(gl.wrap);
    body.appendChild(glRow);

    // وضوح الخط الخفيف
    var bRow = U.rowEl('وضوح الخط الخفيف حول الأطراف', 'الخط الهادئ الموجود دائماً على الحواف');
    var b = U.slider({ min: 0, max: 1, step: 0.02, value: S.edgeBaseOpacity, unit: '', onInput: function (v) {
      S.edgeBaseOpacity = v; U.lsSet(LSP + 'edgeBaseOpacity', v); edgeApplyStyle();
    }});
    b.input.setAttribute('data-role', 'edge-base');
    bRow.appendChild(b.wrap);
    body.appendChild(bRow);

    // أزرار: تجربة + استرجاع الافتراضي
    var actRow = U.el('div', 'uc-row-actions');
    var testBtn = U.btnEl('تجربة الإطار 4 ثوانٍ', 'primary', 'frame');
    var resetBtn = U.btnEl('استرجاع الافتراضي', 'ghost', 'check');
    var previewBox = U.el('div', 'uc-preview', 'معاينة مباشرة: أي تعديل يظهر فوراً على أطراف الشاشة');
    actRow.appendChild(testBtn); actRow.appendChild(resetBtn);
    body.appendChild(actRow);
    body.appendChild(previewBox);

    var preview = function () {
      previewBox.textContent = 'اللون ' + S.edgeColor + ' · سماكة ' + Number(S.edgeWidth).toFixed(1) +
        'px · سرعة ' + S.edgeSpeed + ' · توهج ' + Number(S.edgeGlowSize).toFixed(1);
    };
    preview();

    testBtn.addEventListener('click', function () {
      var before = edge.on;
      if (!before) edgeSet(true);
      U.toast('معاينة الإطار — سيرجع لحالته الطبيعية بعد 4 ثوانٍ', 'ok');
      setTimeout(function () { if (!before) edgeSet(false); else updateAlarmBar(); }, 4000);
    });
    resetBtn.addEventListener('click', function () {
      var D2 = (cfg.display || {});
      S.edgeColor = D2.edgeColor || '#ff2d2d';
      S.edgeWidth = clampNum(D2.edgeWidth || 3.4, 1, 8);
      S.edgeGlowSize = clampNum(D2.edgeGlowSize == null ? 3.2 : D2.edgeGlowSize, 0, 12);
      S.edgeSpeed = clampNum(D2.edgeSpeed || 980, 200, 2600);
      S.edgeBaseOpacity = clampNum(D2.edgeBaseOpacity == null ? 0.34 : D2.edgeBaseOpacity, 0, 1);
      ['edgeColor', 'edgeWidth', 'edgeGlowSize', 'edgeSpeed', 'edgeBaseOpacity'].forEach(function (k) {
        U.lsSet(LSP + k, S[k]);
      });
      picker.set(S.edgeColor); spd.set(S.edgeSpeed); wid.set(S.edgeWidth); gl.set(S.edgeGlowSize); b.set(S.edgeBaseOpacity);
      edgeApplyStyle(); edgeResize(); preview();
      U.toast('تم استرجاع القيم الافتراضية', 'ok');
    });

    return c.wrap;
  }

  /* ---------- الإعدادات (نافذة) ---------- */
  function openSettings() {
    var sheet = U.buildSettings({
      title: 'إعدادات شاشة الاستقبال',
      subtitle: 'التنبيهات، الصوت، حجم الخط، وتثبيت التطبيق',
      room: room,
      state: {
        sound: S.sound,
        alarmRepeat: S.alarmRepeat, alarmEvery: S.alarmEvery,
        notifyRepeat: S.notifyRepeat, fontScale: S.fs
      },
      showDisplay: true,
      onChange: function (key, val) {
        if (key === 'sound') { S.sound = val; U.lsSet(LSP + 'sound', val); syncToggles(); }
        else if (key === 'alarmRepeat') { S.alarmRepeat = val; U.lsSet(LSP + 'alarmRepeat', val); updateAlarmBar(); if (val) startAlarmLoop(); }
        else if (key === 'notifyRepeat') { S.notifyRepeat = val; U.lsSet(LSP + 'notifyRepeat', val); }
        else if (key === 'fontScale') { S.fs = clampFs(val); U.lsSet(LSP + 'fs', S.fs); applyFs(); }
      },
      extra: [edgeSection()],
      onPush: function (sub) { onPushSub(sub); },
      onPushOff: function () { onPushSub(null); }
    });
    U.openModal(sheet);
  }

  function onPushSub(sub) {
    var topic_ = 'push/sub/display-' + devId();
    if (sub) {
      S.pushOn = true;
      var j = sub.toJSON ? sub.toJSON() : sub;
      bus.publish(topic_, { sub: j, role: 'display', name: S.opName, ts: Date.now() }, { retain: true });
      U.toast('تم تفعيل الإشعارات في الخلفية على هذا الجهاز', 'ok');
    } else {
      S.pushOn = false;
      bus.publish(topic_, '', { retain: true });
    }
  }

  function devId() {
    var id = U.lsGet(LSP + 'devId', '');
    if (!id) { id = U.randToken(10); U.lsSet(LSP + 'devId', id); }
    return id;
  }

  /* ---------- التهيئة ---------- */
  // أي تغيير في المخزن (خبر جديد/إشارة نسخ/تثبيت/حذف) => إعادة رسم مؤجلة قليلاً
  var renderQueued = false;
  function queueRender() {
    if (renderQueued) return;
    renderQueued = true;
    setTimeout(function () { renderQueued = false; render(); }, 20);
  }
  store.on('change', queueRender);

  function init() {
    var ch = cfg.channel || {};
    if (ch.title) { U.txt(U.$('#chTitle'), ch.title); document.title = ch.title + ' — شاشة الأخبار العاجلة'; }
    if (ch.subtitle) U.txt(U.$('#chSub'), ch.subtitle); else U.$('#chSub').classList.add('hidden');
    var logoEl = U.$('#chLogo');
    if (ch.logo && logoEl && logoEl.tagName === 'IMG') {
      if (/\.(png|jpe?g|svg|webp|gif)$/i.test(ch.logo)) { logoEl.src = ch.logo; }
      else { logoEl.replaceWith(Object.assign(document.createElement('span'), { className: 'logo-emoji', textContent: ch.logo })); }
      if (ch.logoAlt) logoEl.alt = ch.logoAlt;
    }
    if (D.showHint === false) hintBox.classList.add('hidden');

    applyFs();
    syncToggles();
    store.load();
    render();
    wire();
    // ميزات التطبيق (لا تمنع الاتصال إن فشلت لأي سبب)
    try { U.initInstallCapture(); } catch (e) {}
    try { U.registerSW(); } catch (e) {}
    try { U.pushStatus().then(function (r) { S.pushOn = !!(r && r.subscribed); }); } catch (e) {}
    try { updateAlarmBar(); startAlarmLoop(); } catch (e) {}
    showEditorButton();
    bus.connect();
    bus.startPresence();
    setInterval(function () { U.txt(clockEl, U.fmtClock(Date.now())); }, 1000);
    U.txt(clockEl, U.fmtClock(Date.now()));
    U.hydrateIcons(document);
    var vc = U.$('#verChip');
    if (vc) { if (cfg.version) U.txt(vc, 'v' + cfg.version); else vc.classList.add('hidden'); }
    setInterval(tick, 15000);
  }

  /* ---------- زر العودة للتحرير: للمحررين المسجّلين على هذا الجهاز فقط ---------- */
  function showEditorButton() {
    try {
      var btn = U.$('#btnToEditor');
      if (!btn) return;
      var sess = U.lsGet(U.LS_PREFIX + room + ':session', null);
      if (!sess || !sess.user) return;                              // زائر عادي => لا يظهر شيء
      if (sess.exp && sess.exp < Date.now()) return;                // جلسة منتهية
      if (!U.findAdmin(sess.user)) return;                          // حساب لم يعد موجوداً
      btn.href = 'send.html#r=' + encodeURIComponent(room);   // نفس القناة
      btn.classList.remove('hidden');
    } catch (e) {}
  }

  function applyFs() { feed.style.setProperty('--fs', String(S.fs)); }

  function syncToggles() {
    btnSound.className = 'chip ico-only' + (S.sound ? ' on' : '');
    btnSound.title = S.sound ? 'الصوت مفعّل — اضغط للإيقاف' : 'الصوت متوقف — اضغط للتفعيل';
    var sic = btnSound.querySelector('.ico');
    if (sic) {
      var name = S.sound ? 'sound' : 'soundOff';
      if (sic.getAttribute('data-ic') !== name) { sic.setAttribute('data-ic', name); U.hydrateIcons(btnSound); }
    }
  }

  /* ---------- الأحداث ---------- */
  function wire() {
    function unlock(e) {
      if (e && e.target && e.target.closest && e.target.closest('a')) return;
      alerter.unlock();
      U.askNotify();
      syncToggles();
    }
    document.addEventListener('click', unlock);
    document.addEventListener('keydown', unlock);

    U.$('#btnSound').addEventListener('click', function () {
      S.sound = !S.sound;
      U.lsSet(LSP + 'sound', S.sound);
      if (S.sound) { alerter.unlock(); alerter.play('info'); }
      syncToggles();
    });
    U.$('#btnFontPlus').addEventListener('click', function () { S.fs = clampFs(S.fs + 0.15); U.lsSet(LSP + 'fs', S.fs); applyFs(); });
    U.$('#btnFontMinus').addEventListener('click', function () { S.fs = clampFs(S.fs - 0.15); U.lsSet(LSP + 'fs', S.fs); applyFs(); });
    // شريط التنبيه المتكرر
    U.$('#btnAlarmMute').addEventListener('click', function () {
      S.alarmMutedUntil = Date.now() + 5 * 60e3;
      U.toast('تم إسكات التنبيه 5 دقائق — سيُعاد تلقائياً', 'warn');
      updateAlarmBar();
    });
    U.$('#btnAlarmOff').addEventListener('click', function () {
      S.alarmRepeat = false;
      U.lsSet(LSP + 'alarmRepeat', false);
      updateAlarmBar();
      U.toast('تم إيقاف تكرار التنبيه — يمكن تشغيله من الإعدادات', 'warn');
    });

    // شاشة الإعدادات
    U.$('#btnSettings').addEventListener('click', function () { openSettings(); });

    U.$('#btnFull').addEventListener('click', function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      } catch (e) {}
    });
    window.addEventListener('online', function () { bus.reconnectNow(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
    // النسخ متاح فقط عبر زر «نسخ الخبر»:
    //    نمنع تحديد النص، والنسخ/القص، وقائمة الزر الأيمن داخل قائمة الأخبار.
    var lastWarn = 0;
    function warnCopyOnly(e) {
      if (e) e.preventDefault();
      var now = Date.now();
      if (now - lastWarn > 4000) { lastWarn = now; U.toast('النسخ متاح فقط عبر زر «نسخ الخبر»', 'warn'); }
    }
    ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (ev) {
      feed.addEventListener(ev, warnCopyOnly);
      emptyBox.addEventListener(ev, warnCopyOnly);
    });
    document.addEventListener('keydown', function (e) {
      var k = e.key ? e.key.toLowerCase() : '';
      if (e.ctrlKey && (k === 'c' || k === 'x')) warnCopyOnly(e);
    });

    // نقرة على زر النسخ داخل أي بطاقة
    feed.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('[data-copy]') : null;
      if (btn) { copyItem(btn.getAttribute('data-copy')); }
    });
  }

  /* ---------- استقبال الرسائل ---------- */
  function onMessage(rel, data, isEmpty) {
    if (rel.indexOf('news/') === 0) {
      var id = rel.slice(5);
      if (isEmpty) { store.remove(id); return; }         // خبر محذوف من المحرر
      if (!data || !data.id) data = { id: id, t: '', ts: Date.now() };
      if (!data.t) return;
      var res = store.applyNews({ id: data.id || id, t: data.t, a: data.a, ts: data.ts, e: data.e });
      if (res && res.isNew) onNewItem(res.item);
      return;
    }
    if (rel.indexOf('ack/') === 0) {
      if (!isEmpty && data) {
        S.acksSeen[data.id || rel.slice(4)] = true;
        store.applyAck(data);
      }
      return;
    }
    if (rel.indexOf('pin/') === 0) {
      var pid = rel.slice(4);
      if (isEmpty) store.applyPin({ id: pid }, false);
      else if (data && data.id) store.applyPin(data, true);
      return;
    }
    if (rel.indexOf('presence/') === 0) {
      if (!data || data.role === 'display') return;
      if (isEmpty || data.off || !data.ts) { delete S.editors[data.who]; renderEditors(); return; }
      S.editors[data.who] = { name: data.name || data.who, ts: data.ts };
      renderEditors();
      return;
    }
    if (rel === 'ctrl' && data && data.action === 'delete' && data.id) { store.remove(data.id); return; }
    if (rel === 'push/endpoint') {
      S.pushEndpoint = (data && data.url) ? String(data.url) : '';
      return;
    }
  }

  function onState(st, info) {
    // بلا أي تنبيهات أو شريط: مؤشر الاتصال (النقطة) وحده يكفي — أحمر عند الانقطاع، أخضر عند الاتصال
    if (st === 'connected') {
      connDot.className = 'dot on';
      U.txt(connText, 'متصل');
    } else if (st === 'connecting') {
      connDot.className = 'dot wait';
      U.txt(connText, 'جارٍ الاتصال…');
    } else {
      connDot.className = 'dot off';
      U.txt(connText, 'غير متصل');
    }
  }

  function onReady() { render(); setTimeout(pruneOld, 9000); }

  /* ---------- خبر جديد ---------- */
  /* ===================== إطار التنبيه المضيء (إضاءة الأطراف) ===================== */
  var EDGE_SPEEDS = { normal: 620, fast: 980, veryfast: 1500 };   // بكسل في الثانية
  var edge = {
    box: U.$('#edgeGlow'), svg: U.$('#edgeSvg'),
    base: U.$('#edgeBase'), run: U.$('#edgeRun'), core: U.$('#edgeCore'),
    styleEl: null, on: false, len: 0
  };

  function edgeSpeed() { return clampNum(S.edgeSpeed, 200, 2600); }

  // تطبيق اللون والسماكة والتوهج على عناصر الإطار
  function edgeApplyStyle() {
    if (!edge.box) return;
    var c = S.edgeColor || '#ff2d2d';
    edge.box.style.setProperty('--edge-color', c);
    if (edge.run) {
      edge.run.style.stroke = c;
      edge.run.style.strokeWidth = S.edgeWidth + 'px';
    }
    if (edge.core) {
      edge.core.style.stroke = '#fff';
      edge.core.style.strokeWidth = Math.max(0.8, S.edgeWidth * 0.44) + 'px';
      edge.core.style.opacity = String(Math.min(1, 0.35 + S.edgeGlowSize / 12));
    }
    if (edge.base) {
      edge.base.style.stroke = c;
      edge.base.style.strokeWidth = Math.max(1, S.edgeWidth * 0.55) + 'px';
      edge.base.style.opacity = String(S.edgeBaseOpacity);
    }
    var blur = edge.box.querySelector('feGaussianBlur');
    if (blur) blur.setAttribute('stdDeviation', String(S.edgeGlowSize));
    var halo = edge.box.querySelector('.ehalo');
    if (halo) {
      var strength = Math.min(1, S.edgeGlowSize / 8);
      halo.style.boxShadow = 'inset 0 0 ' + Math.round(30 + strength * 40) + 'px ' + hexA(c, 0.20 + strength * 0.35) +
        ', inset 0 0 ' + Math.round(6 + strength * 8) + 'px ' + hexA(c, 0.35 + strength * 0.4);
      halo.style.display = S.edgeGlowSize < 0.4 ? 'none' : 'block';
    }
  }

  // تحويل لون HEX إلى rgba بشفافية
  function hexA(hex, a) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex));
    if (!m) return 'rgba(255,45,45,' + a + ')';
    var n = parseInt(m[1], 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function edgeResize() {
    if (!edge.svg) return;
    edgeApplyStyle();
    var w = window.innerWidth, hgt = window.innerHeight;
    var pad = 2.4;
    var attrs = {
      x: pad, y: pad, width: Math.max(0, w - pad * 2), height: Math.max(0, hgt - pad * 2), rx: Math.min(18, hgt / 12)
    };
    [edge.base, edge.run, edge.core].forEach(function (r) {
      if (!r) return;
      for (var k in attrs) r.setAttribute(k, attrs[k]);
    });
    // طول المسار (مع بديل إن لم يدعمه المتصفح)
    var len = 0;
    try { len = edge.base.getTotalLength(); } catch (e) { len = 0; }
    if (!len || !isFinite(len)) len = 2 * (w + hgt);
    edge.len = len;

    // مقطع مضيء يدور على الأطراف
    var seg = Math.max(150, Math.min(430, len * 0.17));
    var dur = Math.max(0.7, len / edgeSpeed());
    [edge.run, edge.core].forEach(function (r) {
      if (!r) return;
      r.style.strokeDasharray = seg + ' ' + Math.max(1, len - seg);
      r.style.strokeDashoffset = '0';
      r.style.animation = 'edgeRun ' + dur.toFixed(2) + 's linear infinite';
    });
    if (!edge.styleEl) {
      edge.styleEl = document.createElement('style');
      document.head.appendChild(edge.styleEl);
    }
    edge.styleEl.textContent =
      '@keyframes edgeRun{from{stroke-dashoffset:0}to{stroke-dashoffset:-' + len.toFixed(1) + '}}';
  }

  function edgeSet(on) {
    if (!edge.box) return;
    if (on === edge.on) return;
    edge.on = on;
    edge.box.classList.toggle('on', on);
    if (on) {
      edgeApplyStyle();
      edgeResize();
      window.addEventListener('resize', edgeResize);
      window.addEventListener('orientationchange', edgeResize);
    } else {
      window.removeEventListener('resize', edgeResize);
      window.removeEventListener('orientationchange', edgeResize);
    }
  }

  /* ---------- التنبيه المتكرر كل 30 ثانية حتى يتم نسخ الخبر ---------- */
  var alarmTimer = null;

  function uncopiedItems() {
    return store.list().filter(function (it) { return !(it.ack && it.ack.kind === 'copied'); });
  }

  function updateAlarmBar() {
    var n = uncopiedItems().length;
    var on = S.alarmRepeat && n > 0;
    edgeSet(on && S.edgeGlow !== false);       // إضاءة أطراف الشاشة
    alarmbar.classList.toggle('hidden', !on);
    if (on) {
      var secs = Math.round((S.alarmMutedUntil - Date.now()) / 1000);
      U.txt(alarmText, secs > 0
        ? 'التنبيه مُسكت مؤقتاً (' + Math.ceil(secs / 60) + ' دقيقة) — ' + n + ' خبر بانتظار النسخ'
        : 'تنبيه متكرر كل ' + S.alarmEvery + ' ثانية حتى يتم النسخ — ' + n + ' خبر بانتظار النسخ');
    }
    updateTitle();
  }

  function updateTitle() {
    var n = uncopiedItems().length;
    var base = (cfg.channel && cfg.channel.title) || 'غرفة الأخبار';
    document.title = (n ? '(' + n + ') تنبيه — ' : '') + base;
  }

  function fireAlarm() {
    if (S.sound && Date.now() > S.alarmMutedUntil) alerter.play('urgent');
  }

  function startAlarmLoop() {
    if (alarmTimer) clearInterval(alarmTimer);
    alarmTimer = setInterval(function () {
      var list = uncopiedItems();
      if (!S.alarmRepeat || !list.length) { updateAlarmBar(); return; }
      // 1) تنبيه صوتي متكرر
      fireAlarm('repeat');
      // 2) إشعار نظام متكرر (عندما تكون الشاشة في الخلفية أو مخفية)
      if (S.notifyRepeat && (document.hidden || !alerter.ready())) {
        var first = list[0];
        var body = first ? ('بانتظار النسخ (' + list.length + '): ' + String(first.text).slice(0, 120)) : 'خبر بانتظار النسخ';
        reNotify(body, list.length);
      }
      updateAlarmBar();
    }, Math.max(10, S.alarmEvery) * 1000);
  }

  function reNotify(body, count) {
    var title = 'خبر عاجل لم يُنسخ بعد';
    if (!U.showViaSW(title, body, 'yt-uncopied') && 'Notification' in window && Notification.permission === 'granted') {
      U.browserNotify(title, body);
    }
    if (S.pushOn && S.pushEndpoint) {
      bus.publish('push/send', { title: title, body: body, count: count, ts: Date.now() });
    }
  }

  function onNewItem(item) {
    S.fresh[item.id] = Date.now();
    S.alarmMutedUntil = 0;
    if (S.sound) alerter.play('urgent');
    var nTitle = 'خبر عاجل — ' + (item.author || 'غرفة الأخبار');
    if (!U.showViaSW(nTitle, String(item.text).slice(0, 180), 'yt-' + item.id) && 'Notification' in window) {
      U.browserNotify(nTitle, item.text);
    }
    if (S.pushOn && S.pushEndpoint) {
      bus.publish('push/send', { title: nTitle, body: String(item.text).slice(0, 180), count: uncopiedItems().length, id: item.id, ts: Date.now() });
    }
    if (document.hidden) U.flashTitle('خبر عاجل');
    scheduleReceivedAck(item);
    render();
    updateAlarmBar();
    if (S.alarmRepeat) startAlarmLoop();
  }

  // إشعار المحرر بأن الخبر وصل إلى شاشة المنفذ
  function scheduleReceivedAck(item) {
    if (cfg.ackOnReceive === false) return;
    setTimeout(function () {
      var cur = store.get(item.id);
      if (cur && !cur.ack && !S.acksSeen[item.id]) {
        var a = { id: item.id, k: 'received', b: S.opName, ts: Date.now() };
        bus.publish('ack/' + item.id, a, { retain: true });
        store.applyAck(a);
      }
    }, 2500);
  }

  /* ---------- النسخ ---------- */
  function copyItem(id) {
    var it = store.get(id);
    if (!it) return;
    U.copyText(it.text).then(function (ok) {
      var a = { id: id, k: 'copied', b: S.opName, ts: Date.now(), n: ok ? '' : 'manual' };
      store.applyAck(a);
      bus.publish('ack/' + id, a, { retain: true });
      alerter.play('info');
      updateAlarmBar();
      U.toast(ok ? 'تم نسخ الخبر وإبلاغ المحرر' : 'لم يتوفر النسخ التلقائي — استخدم زر النسخ مرة أخرى', ok ? 'ok' : 'warn');
    });
  }

  /* ---------- حذف الأخبار القديمة ---------- */
  function pruneOld() {
    if (S.pruned) return;
    S.pruned = true;
    var days = Number(cfg.maxAgeDays || 0);
    if (!days) return;
    var cut = Date.now() - days * 86400e3;
    store.list().forEach(function (it) { if (it.ts < cut) wipe(it.id); });
  }
  function wipe(id) {
    bus.publish('news/' + id, '', { retain: true });
    bus.publish('ack/' + id, '', { retain: true });
    bus.publish('pin/' + id, '', { retain: true });
    bus.publish('ctrl', { action: 'delete', id: id });
    store.remove(id);
  }

  /* ---------- العرض ---------- */
  var nodes = {};

  function render() {
    var items = store.list();
    var want = {};
    items.forEach(function (it) { want[it.id] = true; });

    Object.keys(nodes).forEach(function (id) {
      if (!want[id]) { nodes[id].remove(); delete nodes[id]; delete S.fresh[id]; }
    });

    var prev = null;
    items.forEach(function (it) {
      var node = nodes[it.id];
      if (!node) { node = buildCard(it); nodes[it.id] = node; }
      updateCard(node, it);
      if (prev !== node) {
        var expected = prev ? prev.nextSibling : feed.firstChild;
        if (expected !== node) feed.insertBefore(node, expected);
      }
      prev = node;
    });

    emptyBox.classList.toggle('hidden', items.length > 0);
    if (!items.length && !feed.contains(emptyBox)) feed.appendChild(emptyBox);
    if (items.length) updateHeaderCount(items);
  }

  function updateHeaderCount(items) {
    var st = store.stats();
    var pending = st.pending + st.received;
    document.title = (pending ? '(' + pending + ') ' : '') + ((cfg.channel && cfg.channel.title) || 'غرفة الأخبار');
  }

  function buildCard(it) {
    var card = U.el('article', 'card');
    card.setAttribute('data-id', it.id);

    var top = U.el('div', 'card-top');
    var tag = U.el('span', 'tag');
    tag.innerHTML = '<i class="livedot"></i>عاجل';
    top.appendChild(tag);
    top.appendChild(U.el('span', 'who', it.author || 'غرفة الأخبار'));
    top.appendChild(U.el('span', 'sep', '•'));
    var ts = U.el('span', 'ts'); ts.setAttribute('data-role', 'ts'); top.appendChild(ts);
    var ed = U.el('span', 'mini hidden'); ed.setAttribute('data-role', 'edited'); top.appendChild(ed);
    var pin = U.el('span', 'mini gold hidden'); pin.setAttribute('data-role', 'pin');
    pin.innerHTML = U.ic('pin', 14) + 'مثبّت'; top.appendChild(pin);
    var nw = U.el('span', 'mini new hidden'); nw.setAttribute('data-role', 'new'); nw.textContent = 'جديد'; top.appendChild(nw);
    top.appendChild(U.el('span', 'grow2'));
    var rel = U.el('span', 'ts'); rel.setAttribute('data-role', 'rel'); top.appendChild(rel);
    card.appendChild(top);

    var text = U.el('p', 'text'); text.setAttribute('data-role', 'text'); card.appendChild(text);

    var bottom = U.el('div', 'card-bottom');
    var stat = U.el('span', 'stat'); stat.setAttribute('data-role', 'stat'); bottom.appendChild(stat);
    var actions = U.el('div', 'actions');
    var recopy = U.el('button', 'recopy-btn hidden'); recopy.setAttribute('data-role', 'recopy'); recopy.textContent = '↺ إعادة النسخ';
    var copy = U.el('button', 'copy-btn'); copy.setAttribute('data-role', 'copy');
    copy.innerHTML = U.ic('copy', 20) + 'نسخ الخبر';
    actions.appendChild(recopy); actions.appendChild(copy);
    bottom.appendChild(actions);
    card.appendChild(bottom);
    return card;
  }

  function updateCard(card, it) {
    var r = function (role) { return card.querySelector('[data-role="' + role + '"]'); };
    U.txt(r('text'), it.text);
    U.txt(r('ts'), U.fmtTime(it.ts));
    U.txt(r('rel'), U.rel(it.ts));
    r('edited').classList.toggle('hidden', !it.editedAt);
    if (it.editedAt) U.txt(r('edited'), 'محدَّث ' + U.fmtTime(it.editedAt));
    r('pin').classList.toggle('hidden', !it.pin);

    var fresh = S.fresh[it.id] && (Date.now() - S.fresh[it.id] < 20000);
    card.classList.toggle('fresh', !!fresh);
    r('new').classList.toggle('hidden', !fresh);

    var ack = it.ack;
    var copied = ack && ack.kind === 'copied';
    card.classList.toggle('copied', !!copied);
    card.classList.toggle('pinned', !!it.pin);

    var stat = r('stat'), copyBtn = r('copy'), recopyBtn = r('recopy');
    if (copied) {
      stat.className = 'stat copied';
      U.setIconText(stat, 'check', 'تم النسخ بواسطة ' + (ack.by || 'المنفذ') + ' — ' + U.fmtTime(ack.ts));
      copyBtn.classList.add('hidden');
      recopyBtn.classList.remove('hidden');
      recopyBtn.setAttribute('data-copy', it.id);
    } else if (ack && ack.kind === 'received') {
      stat.className = 'stat received';
      U.setIconText(stat, 'inbox', 'وصل إلى الشاشة — جاهز للنسخ عبر الزر');
      copyBtn.classList.remove('hidden');
      copyBtn.setAttribute('data-copy', it.id);
      recopyBtn.classList.add('hidden');
    } else {
      stat.className = 'stat pending';
      U.setIconText(stat, 'clock', 'بانتظار النسخ — اضغط زر «نسخ الخبر»');
      copyBtn.classList.remove('hidden');
      copyBtn.setAttribute('data-copy', it.id);
      recopyBtn.classList.add('hidden');
    }
  }

  function renderEditors() {
    var now = Date.now();
    var online = Object.keys(S.editors).filter(function (k) { return (now - S.editors[k].ts) < U.ONLINE_TTL; });
    // إزالة المنتهين
    Object.keys(S.editors).forEach(function (k) { if ((now - S.editors[k].ts) >= U.ONLINE_TTL) delete S.editors[k]; });
    editorsBox.classList.toggle('hidden', online.length === 0);
    if (!online.length) { editorsBox.innerHTML = ''; editorsBox.appendChild(U.el('span', 'lbl', 'المحررون المتصلون:')); return; }
    editorsBox.innerHTML = '';
    editorsBox.appendChild(U.el('span', 'lbl', 'المحررون المتصلون:'));
    online.forEach(function (k) {
      var c = U.el('span', 'edchip'); c.appendChild(U.el('i'));
      c.appendChild(document.createTextNode(S.editors[k].name));
      editorsBox.appendChild(c);
    });
  }

  function tick() {
    var now = Date.now();
    store.list().forEach(function (it) {
      var node = nodes[it.id];
      if (!node) return;
      var r = function (role) { return node.querySelector('[data-role="' + role + '"]'); };
      if (r('rel')) U.txt(r('rel'), U.rel(it.ts));
      var fresh = S.fresh[it.id] && (now - S.fresh[it.id] < 20000);
      node.classList.toggle('fresh', !!fresh);
      if (r('new')) r('new').classList.toggle('hidden', !fresh);
    });
    renderEditors();
  }

  // أوامر من خدمة التطبيق (مثل زر «نسخ» داخل الإشعار)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'copy-first') {
        var list = uncopiedItems();
        if (list.length) { copyItem(list[0].id); U.toast('تم نسخ أحدث خبر عاجل من الإشعار', 'ok'); }
      }
    });
  }

  init();
})();
</script>
</body>
</html>
